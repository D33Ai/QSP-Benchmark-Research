<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="610" viewBox="0 0 1000 610" role="img" aria-labelledby="t d"><title id="t">A three-dot cut puzzle</title><desc id="d">A red A and two green Bs form a triangle. Two of its three edges cross between teams. Three dots on two teams must share at least one same-team edge.</desc>
<rect x="0" y="0" width="1000" height="610" rx="0" fill="#f9f8f2"/>
<rect x="0" y="0" width="1000" height="8" rx="0" fill="#146b62"/>
<text x="40" y="48" fill="#146b62" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="700" text-anchor="start" >D33 AI   /   QSP PUZZLE LAB</text>
<text x="960" y="48" fill="#40585a" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="500" text-anchor="end" >03   /   A SHORTCUT</text>
<line x1="40" y1="65" x2="960" y2="65" stroke="#b8cbc3" stroke-width="1.6" stroke-linecap="round" />
<text x="40" y="121" fill="#172e30" font-family="DejaVu Sans, sans-serif" font-size="38" font-weight="700" text-anchor="start" >Can you beat this score?</text>
<text x="40" y="159" fill="#40585a" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" text-anchor="start" >Give each dot a team. Earn one point for every line between different teams.</text>
<rect x="40" y="193" width="411" height="288" rx="20" fill="#eaf1e9"/>
<text x="62" y="225" fill="#146b62" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" text-anchor="start" >TRY A TRIANGLE</text>
<text x="62" y="454" fill="#172e30" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700" text-anchor="start" >The best score is 2</text>
<line x1="241" y1="266" x2="121" y2="391" stroke="#146b62" stroke-width="8" stroke-linecap="round" />
<line x1="241" y1="266" x2="362" y2="391" stroke="#146b62" stroke-width="8" stroke-linecap="round" />
<line x1="121" y1="391" x2="362" y2="391" stroke="#7d8c85" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 9"/>
<circle cx="241" cy="266" r="22" fill="#ffb394" stroke="#172e30" stroke-width="3"/>
<text x="241" y="274" fill="#172e30" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" text-anchor="middle" >A</text>
<circle cx="121" cy="391" r="22" fill="#d6f0de" stroke="#172e30" stroke-width="3"/>
<text x="121" y="399" fill="#172e30" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" text-anchor="middle" >B</text>
<circle cx="362" cy="391" r="22" fill="#d6f0de" stroke="#172e30" stroke-width="3"/>
<text x="362" y="399" fill="#172e30" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" text-anchor="middle" >B</text>
<text x="484" y="220" fill="#172e30" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700" text-anchor="start" >Why three points are impossible</text>
<text x="484" y="263" fill="#40585a" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" text-anchor="start" >There are 3 dots and only 2 teams.</text>
<text x="484" y="297" fill="#40585a" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" text-anchor="start" >Two dots must share a team.</text>
<text x="484" y="331" fill="#40585a" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" text-anchor="start" >Their line earns zero points.</text>
<line x1="484" y1="359" x2="943" y2="359" stroke="#b8cbc3" stroke-width="2" stroke-linecap="round" />
<text x="484" y="401" fill="#146b62" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" text-anchor="start" >2 is possible. 3 is impossible.</text>
<text x="484" y="444" fill="#40585a" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" text-anchor="start" >That is a proof for this tiny graph.</text>
<rect x="40" y="507" width="920" height="80" rx="13" fill="#0e3939"/>
<text x="60" y="539" fill="#fffef9" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" text-anchor="start" >In the real 30-dot test, QSP proved that 66 was the limit.</text>
<text x="60" y="568" fill="#d7e9dc" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" text-anchor="start" >Ruling out 67 fell from 8.428 seconds to 0.553 milliseconds on that graph.</text>
</svg>
